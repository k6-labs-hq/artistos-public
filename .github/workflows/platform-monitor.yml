name: Platform Self-Monitor

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Platform Monitor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m intelligence.monitor.cli --file-issues --output json > monitor-results.json
          cat monitor-results.json
      
      - name: Upload monitoring results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-results
          path: monitor-results.json
          retention-days: 30
      
      - name: Check for P0 findings
        run: |
          if grep -q '"severity": "P0"' monitor-results.json; then
            echo "::error::P0 critical findings detected - blocking deployment"
            exit 1
          fi
          echo "::notice::No P0 findings - system healthy"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Platform monitor detected critical issues. Check artifacts for details."
