name: Frontend Tests

# Runs on every push and pull request.
# Executes frontend unit tests and enforces coverage thresholds.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --run

      - name: Generate coverage report
        run: npm run test -- --run --coverage

      - name: Check coverage thresholds
        run: |
          echo "Coverage thresholds enforced in vite.config.ts:"
          echo "  - Lines:      15%"
          echo "  - Functions:  15%"
          echo "  - Branches:   10%"
          echo "  - Statements: 15%"
          echo ""
          echo "If tests pass, coverage meets minimum thresholds."
          echo "See coverage/index.html for detailed report."

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 7

      - name: Comment coverage summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coveragePath = './frontend/coverage/coverage-summary.json';

            if (!fs.existsSync(coveragePath)) {
              console.log('Coverage summary not found, skipping comment');
              return;
            }

            const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
            const total = coverage.total;

            const comment = `## 🧪 Frontend Test Coverage

            | Metric | Coverage | Threshold |
            |--------|----------|-----------|
            | Lines | ${total.lines.pct.toFixed(2)}% | 15% |
            | Functions | ${total.functions.pct.toFixed(2)}% | 15% |
            | Branches | ${total.branches.pct.toFixed(2)}% | 10% |
            | Statements | ${total.statements.pct.toFixed(2)}% | 15% |

            **Status:** ${total.lines.pct >= 15 && total.functions.pct >= 15 && total.branches.pct >= 10 && total.statements.pct >= 15 ? '✅ Passing' : '❌ Below threshold'}

            📊 [View full coverage report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  frontend-lint:
    name: Frontend Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (if configured)
        run: |
          if [ -f ".eslintrc.json" ] || [ -f ".eslintrc.js" ]; then
            npm run lint
          else
            echo "No ESLint config found, skipping"
          fi
        continue-on-error: true

      - name: Run TypeScript type check
        run: npx tsc --noEmit --project tsconfig.json
