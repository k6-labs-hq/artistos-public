name: SDK Publish

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "openapi/openapi.json"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Force publish even without SDK changes (true/false)"
        required: false
        default: "false"
      publish_python:
        description: "Publish Python SDK (true/false)"
        required: false
        default: "true"
      publish_typescript:
        description: "Publish TypeScript SDK (true/false)"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Ensure the committed OpenAPI spec matches what the live app exports.
  # -------------------------------------------------------------------------
  openapi-drift-check:
    name: OpenAPI drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt

      - name: Export live spec
        run: python scripts/export_openapi.py

      - name: Fail on drift
        run: git diff --exit-code openapi/openapi.json

  # -------------------------------------------------------------------------
  # Python SDK — build wheel + publish to PyPI
  # -------------------------------------------------------------------------
  publish-python-sdk:
    name: Publish Python SDK
    runs-on: ubuntu-latest
    needs: openapi-drift-check
    if: github.event_name != 'workflow_dispatch' || inputs.publish_python == 'true'
    environment: pypi
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --upgrade pip build twine

      - name: Build wheel and sdist
        working-directory: sdk/python
        run: python -m build --wheel --sdist

      - name: Validate distribution
        working-directory: sdk/python
        run: twine check dist/*

      - name: Publish to PyPI
        working-directory: sdk/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_TOKEN is not set"
            exit 1
          fi
          twine upload --skip-existing dist/*

  # -------------------------------------------------------------------------
  # TypeScript SDK — build + publish to npm
  # -------------------------------------------------------------------------
  publish-typescript-sdk:
    name: Publish TypeScript SDK
    runs-on: ubuntu-latest
    needs: openapi-drift-check
    if: github.event_name != 'workflow_dispatch' || inputs.publish_typescript == 'true'
    environment: npm
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Build
        working-directory: sdk/typescript
        run: npm run build

      - name: Publish to npm
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set"
            exit 1
          fi
          npm publish --access public
