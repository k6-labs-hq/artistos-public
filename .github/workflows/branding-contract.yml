name: Branding Contract Guard

on:
  # push only runs on main (after merge); PR branch pushes covered by pull_request.
  # Prevents duplicate runs for every PR commit.
  push:
    branches: ["main"]
    paths:
      - XR7/api/routers/**
      - XR7/services/branding.py
      - tests/test_branding.py
      - tests/test_branding_contract_guard.py
      - tests/test_branding_service.py
      - .github/workflows/branding-contract.yml
  pull_request:
    paths:
      - XR7/api/routers/**
      - XR7/services/branding.py
      - tests/test_branding.py
      - tests/test_branding_contract_guard.py
      - tests/test_branding_service.py
      - .github/workflows/branding-contract.yml

jobs:
  branding-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run branding contract tests
        run: |
          pytest -q tests/test_branding.py tests/test_branding_contract_guard.py tests/test_branding_service.py
