name: Performance Regression Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Run nightly to track performance trends
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.12'
  TARGET_URL: http://localhost:8000

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: xr7_test
          POSTGRES_USER: xr7
          POSTGRES_PASSWORD: test123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install locust pytest pytest-benchmark

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://xr7:test123@localhost:5432/xr7_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          alembic upgrade head

      - name: Start API server
        env:
          DATABASE_URL: postgresql://xr7:test123@localhost:5432/xr7_test
          REDIS_URL: redis://localhost:6379/0
          XR7_ENV: testing
          JWT_SECRET: test-secret-key-for-ci-only-not-secure
          WIDGET_ALLOWED_ORIGINS: "*"
        run: |
          uvicorn XR7.api.app:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000/health || exit 1

      - name: Run benchmark tests
        env:
          TARGET_URL: ${{ env.TARGET_URL }}
        run: |
          pytest tests/benchmarks/ -v --benchmark-only --benchmark-json=benchmarks.json

      - name: Validate performance budgets
        run: |
          python scripts/ci/check_performance_regression.py benchmarks.json

      - name: Run Locust load test
        env:
          TARGET_URL: ${{ env.TARGET_URL }}
        run: |
          locust -f tests/load/locustfile.py --headless --users 50 --spawn-rate 10 --run-time 60s --host=$TARGET_URL --html=load-test-report.html

      - name: Upload load test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: load-test-report.html

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks.json

      - name: Comment PR with performance results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('benchmarks.json', 'utf8'));
            const benchmarks = data.benchmarks || [];

            let comment = '## ⚡ Performance Test Results\n\n';
            comment += '| Benchmark | Mean | StdDev | Status |\n';
            comment += '|-----------|------|--------|--------|\n';

            benchmarks.forEach(b => {
              const mean_ms = (b.stats.mean * 1000).toFixed(2);
              const stddev_ms = (b.stats.stddev * 1000).toFixed(2);
              const status = b.stats.mean < 1.0 ? '✅' : '⚠️';
              comment += `| ${b.name} | ${mean_ms}ms | ±${stddev_ms}ms | ${status} |\n`;
            });

            comment += '\n**Performance Budget:** p95 < 1000ms for all endpoints\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
