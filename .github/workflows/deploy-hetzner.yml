name: Deploy → Hetzner

# CI-pushes model: the VM never clones the repo. CI builds and pushes the image
# to GHCR, rsyncs the small set of config files (compose, Caddyfile, deploy.sh)
# to the VM, then SSHes to pull + restart.
#
# - Push to main → auto-deploys to QA
# - Deploy to PROD requires manual workflow_dispatch + approval on the "prod"
#   GitHub Environment.
#
# Per-Environment GitHub secrets (set each under Settings → Environments):
#   HETZNER_SSH_KEY    — private key matching the VM's authorized_keys
#   HETZNER_HOST       — VM IPv4 or DNS name
#   HETZNER_USER       — SSH user (defaults to 'root' on fresh Hetzner images)
#
# Per-Environment GitHub variable:
#   DEPLOY_DOMAIN      — api.qa.xr7.k6-labs.com | api.xr7.k6-labs.com

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment"
        type: choice
        options: [qa, prod]
        default: qa
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: deploy-hetzner-${{ inputs.target_environment || 'qa' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build + push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-qa:
    name: Deploy → QA
    needs: build-and-push
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'qa')
    environment:
      name: qa
      url: https://api.qa.xr7.k6-labs.com
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets present
        id: check
        run: |
          if [[ -z "${{ secrets.HETZNER_SSH_KEY }}" || -z "${{ secrets.HETZNER_HOST }}" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::QA secrets not configured — skipping deploy"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up SSH
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync config files to VM
        if: steps.check.outputs.skip != 'true'
        run: |
          rsync -avz -e "ssh -i ~/.ssh/id_deploy" \
            infrastructure/hetzner/docker-compose.prod.yml \
            infrastructure/hetzner/Caddyfile \
            infrastructure/hetzner/deploy.sh \
            ${{ secrets.HETZNER_USER || 'root' }}@${{ secrets.HETZNER_HOST }}:/opt/artistos/hetzner/

      - name: Run deploy on VM
        if: steps.check.outputs.skip != 'true'
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.HETZNER_USER || 'root' }}@${{ secrets.HETZNER_HOST }} \
            "cd /opt/artistos/hetzner && bash deploy.sh qa"

      - name: Smoke test
        if: steps.check.outputs.skip != 'true'
        run: |
          sleep 10
          curl -fsS --max-time 15 "https://${{ vars.DEPLOY_DOMAIN }}/health" \
            || (echo "QA smoke test failed" >&2; exit 1)
          echo "QA deployed and healthy."

  deploy-prod:
    name: Deploy → Prod (requires approval)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.target_environment == 'prod'
    environment:
      name: prod
      url: https://api.xr7.k6-labs.com
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets present
        run: |
          if [[ -z "${{ secrets.HETZNER_SSH_KEY }}" || -z "${{ secrets.HETZNER_HOST }}" ]]; then
            echo "::error::prod secrets missing"
            exit 1
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync config files to VM
        run: |
          rsync -avz -e "ssh -i ~/.ssh/id_deploy" \
            infrastructure/hetzner/docker-compose.prod.yml \
            infrastructure/hetzner/Caddyfile \
            infrastructure/hetzner/deploy.sh \
            ${{ secrets.HETZNER_USER || 'root' }}@${{ secrets.HETZNER_HOST }}:/opt/artistos/hetzner/

      - name: Run deploy on VM
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.HETZNER_USER || 'root' }}@${{ secrets.HETZNER_HOST }} \
            "cd /opt/artistos/hetzner && bash deploy.sh prod"

      - name: Smoke test
        run: |
          sleep 10
          curl -fsS --max-time 15 "https://${{ vars.DEPLOY_DOMAIN }}/health" \
            || (echo "Prod smoke test failed" >&2; exit 1)
          echo "Prod deployed and healthy."
