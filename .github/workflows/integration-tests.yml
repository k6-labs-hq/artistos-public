name: Integration Tests — External Credentials

# Runs tests marked @pytest.mark.integration which require live external
# credentials (PRO connectors, Trolley sandbox, etc.).
#
# This workflow is intentionally separate from the main quality gate so that
# credential secrets are isolated and the gate never fails due to missing
# third-party sandboxes.
#
# Trigger:
#   - Manual dispatch (workflow_dispatch) — run on demand from the GitHub UI
#   - Schedule: nightly at 02:00 UTC to catch upstream API drift
#   - On push to main (post-merge validation)

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Optional pytest -k filter expression (leave blank to run all integration tests)"
        required: false
        default: ""

  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC nightly

  push:
    branches:
      - main

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false  # never cancel a running integration run; it may be slow

env:
  PYTHON_VERSION: "3.12"
  DATABASE_URL: "sqlite:///./test-integration.db"
  REDIS_URL: "redis://localhost:6379/0"
  XR7_EVIDENCE_HMAC_SECRET: "ci-integration-secret"
  XR7_EVIDENCE_SIGNING_MODE: "hmac"
  # Signal the conftest hook to include @pytest.mark.integration tests
  INTEGRATION_CREDS_AVAILABLE: "1"

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── PRO connector credentials ─────────────────────────────────────────
      # Each secret is injected from the repository / environment secret store.
      # Tests that require a credential they don't have will still be skipped
      # individually via monkeypatch; the presence of INTEGRATION_CREDS_AVAILABLE
      # only lifts the blanket @pytest.mark.integration skip.
      - name: Run integration tests
        run: |
          pytest tests/ \
            -m integration \
            --run-integration \
            ${{ github.event.inputs.test_filter && format('-k "{0}"', github.event.inputs.test_filter) || '' }} \
            --tb=short \
            -v
        env:
          # PRO connectors
          ASCAP_API_KEY: ${{ secrets.ASCAP_API_KEY }}
          BMI_API_KEY: ${{ secrets.BMI_API_KEY }}
          SESAC_API_KEY: ${{ secrets.SESAC_API_KEY }}
          APRA_AMCOS_API_KEY: ${{ secrets.APRA_AMCOS_API_KEY }}
          JASRAC_API_KEY: ${{ secrets.JASRAC_API_KEY }}
          KOMCA_API_KEY: ${{ secrets.KOMCA_API_KEY }}
          SACEM_API_KEY: ${{ secrets.SACEM_API_KEY }}
          MLC_API_KEY: ${{ secrets.MLC_API_KEY }}
          # DSP connectors
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          # Trolley sandbox
          TROLLEY_API_KEY: ${{ secrets.TROLLEY_SANDBOX_API_KEY }}
          TROLLEY_SECRET_KEY: ${{ secrets.TROLLEY_SANDBOX_SECRET_KEY }}
          TROLLEY_ENVIRONMENT: "sandbox"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ github.run_id }}
          path: |
            .pytest_cache/
          retention-days: 7
