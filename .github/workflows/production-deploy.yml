name: Production Build & Deploy

# Triggered on:
#   - Push to main (deploys to staging automatically)
#   - Push of a semver tag v*.*.* (triggers full production deployment with approval gate)
#
# Pipeline stages:
#   1. full-test      — complete test suite (no skip)
#   2. docker-build   — multi-arch image build + scan
#   3. push-registry  — push to GitHub Container Registry
#   4. deploy-staging — kubectl rollout to staging namespace
#   5. smoke-test     — POST /healthz and key endpoint smoke test against staging
#   6. deploy-prod    — gated deploy to production (requires environment approval)

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # STAGE 1: Full test suite (no parallelism shortcuts)
  # Must pass fully before a Docker image is built.
  # ──────────────────────────────────────────────────────────────────────────
  full-test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xr7_ci
          POSTGRES_PASSWORD: xr7_ci_pw
          POSTGRES_DB: xr7_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U xr7_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run Alembic migrations (test DB)
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://xr7_ci:xr7_ci_pw@localhost:5432/xr7_test

      - name: Run full test suite
        run: |
          pytest tests/ \
            --tb=short \
            -q \
            --cov=XR7 \
            --cov=shared \
            --cov-fail-under=60
        env:
          DATABASE_URL: postgresql://xr7_ci:xr7_ci_pw@localhost:5432/xr7_test
          REDIS_URL: redis://localhost:6379/0
          XR7_EVIDENCE_HMAC_SECRET: ci-test-secret
          XR7_EVIDENCE_SIGNING_MODE: hmac

  # ──────────────────────────────────────────────────────────────────────────
  # STAGE 2: Docker image build + vulnerability scan
  # ──────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Scan
    needs: full-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build Docker image (no push yet)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      - name: Push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # STAGE 3: Deploy to staging
  # Auto-deploys on every merge to main.
  # Uses GitHub environment "staging" — no approval required.
  # ──────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    needs: docker-build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.xr7.artistos.io

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.STAGING_KUBECONFIG }}

      - name: Deploy to staging namespace
        run: |
          kubectl set image deployment/xr7-api \
            xr7-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker-build.outputs.image_digest }} \
            -n staging
          kubectl rollout status deployment/xr7-api -n staging --timeout=300s

      - name: Run Alembic migrations (staging DB)
        run: |
          kubectl exec -n staging deployment/xr7-api -- \
            alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  # ──────────────────────────────────────────────────────────────────────────
  # STAGE 4: Staging smoke test
  # Validates the deployed staging instance actually responds correctly.
  # ──────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Staging Smoke Test
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install httpx for smoke test script
        run: pip install httpx

      - name: Run smoke tests against staging
        run: python scripts/smoke_test.py
        env:
          SMOKE_TEST_BASE_URL: https://staging.xr7.artistos.io
          SMOKE_TEST_API_KEY: ${{ secrets.STAGING_SMOKE_API_KEY }}

  # ──────────────────────────────────────────────────────────────────────────
  # STAGE 5: Deploy to production
  # Only runs on semver tags (v*.*.*).
  # Uses GitHub environment "production" which requires manual approval from
  # a member of the "release-engineers" team.
  # ──────────────────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy → Production
    needs: smoke-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://app.xr7.artistos.io

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl (production)
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.PROD_KUBECONFIG }}

      - name: Deploy to production namespace
        run: |
          kubectl set image deployment/xr7-api \
            xr7-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker-build.outputs.image_digest }} \
            -n production
          kubectl rollout status deployment/xr7-api -n production --timeout=600s

      - name: Run Alembic migrations (production DB)
        run: |
          kubectl exec -n production deployment/xr7-api -- \
            alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Post deployment notification to Slack
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "XR7 production deployment *${{ github.ref_name }}*: ${{ job.status }}",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*XR7 Deploy* `${{ github.ref_name }}` → production — *${{ job.status }}*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                }
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
