apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: xr7
resources:
  - ../../base
  - flower.yaml
  - flower-ingress.yaml
patches:
  - path: patch-observability.yaml
  - target:
      kind: Deployment
      name: xr7-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 6
  - target:
      kind: Deployment
      name: xr7-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 6
  - target:
      kind: Ingress
      name: xr7-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.xr7.example.com
images:
  - name: ghcr.io/mkallberg21/artistos-api
    newTag: latest
