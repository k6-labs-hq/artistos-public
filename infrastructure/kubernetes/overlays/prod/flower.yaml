apiVersion: apps/v1
kind: Deployment
metadata:
  name: xr7-flower
  namespace: xr7
  labels:
    app: xr7-flower
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xr7-flower
  template:
    metadata:
      labels:
        app: xr7-flower
    spec:
      serviceAccountName: xr7-workload
      containers:
        - name: flower
          image: ghcr.io/mkallberg21/artistos:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - XR7.celery_app:celery_app
            - flower
            - --address=0.0.0.0
            - --port=5555
            - --persistent=False
          ports:
            - containerPort: 5555
              name: http
          envFrom:
            - secretRef:
                name: xr7-runtime-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 5555
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5555
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: xr7-flower
  namespace: xr7
  labels:
    app: xr7-flower
spec:
  type: ClusterIP
  selector:
    app: xr7-flower
  ports:
    - name: http
      port: 5555
      targetPort: 5555
