apiVersion: apps/v1
kind: Deployment
metadata:
  name: xr7-api
  namespace: xr7
  labels:
    app: xr7-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: xr7-api
  template:
    metadata:
      labels:
        app: xr7-api
    spec:
      serviceAccountName: xr7-workload
      containers:
        - name: api
          image: ghcr.io/mkallberg21/artistos:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: xr7-runtime-secrets
                  key: database_url
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: xr7-runtime-secrets
                  key: celery_broker_url
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: xr7-runtime-secrets
                  key: celery_result_backend
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xr7-worker
  namespace: xr7
  labels:
    app: xr7-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: xr7-worker
  template:
    metadata:
      labels:
        app: xr7-worker
    spec:
      serviceAccountName: xr7-workload
      containers:
        - name: worker
          image: ghcr.io/mkallberg21/artistos:latest
          imagePullPolicy: Always
          command: ["celery", "-A", "XR7.celery_app:celery_app", "worker", "--loglevel=INFO"]
          envFrom:
            - secretRef:
                name: xr7-runtime-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xr7-scheduler
  namespace: xr7
  labels:
    app: xr7-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xr7-scheduler
  template:
    metadata:
      labels:
        app: xr7-scheduler
    spec:
      serviceAccountName: xr7-workload
      containers:
        - name: scheduler
          image: ghcr.io/mkallberg21/artistos:latest
          imagePullPolicy: Always
          command: ["celery", "-A", "XR7.celery_app:celery_app", "beat", "--loglevel=INFO"]
          envFrom:
            - secretRef:
                name: xr7-runtime-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: xr7-api
  namespace: xr7
spec:
  selector:
    app: xr7-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
