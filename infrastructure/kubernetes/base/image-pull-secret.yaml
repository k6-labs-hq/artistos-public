apiVersion: v1
kind: Secret
metadata:
  name: ghcr-io-credentials
  namespace: xr7
type: kubernetes.io/dockercfg
data:
  # This will be populated during bootstrap via scripts/ops/apply_runtime_secret.sh
  # Format: base64({"ghcr.io": {"auth": "base64(username:token)"}})
  .dockercfg: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xr7-workload
  namespace: xr7
imagePullSecrets:
  - name: ghcr-io-credentials
