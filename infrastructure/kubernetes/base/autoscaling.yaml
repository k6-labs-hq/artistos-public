apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: xr7-api
  namespace: xr7
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: xr7-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: xr7-worker
  namespace: xr7
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: xr7-worker
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
