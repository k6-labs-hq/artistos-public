apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xr7-api
  namespace: xr7
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
spec:
  ingressClassName: nginx
  rules:
    - host: api.xr7.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xr7-api
                port:
                  number: 80
