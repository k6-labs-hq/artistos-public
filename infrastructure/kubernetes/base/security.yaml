apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xr7-default-deny
  namespace: xr7
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xr7-allow-api-ingress
  namespace: xr7
spec:
  podSelector:
    matchLabels:
      app: xr7-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: xr7-api
  namespace: xr7
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: xr7-api
