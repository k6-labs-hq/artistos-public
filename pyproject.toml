[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "XR7"
version = "2.0.0"
description = "XR7 Engine 2 - Artist Earnings Accuracy Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "alembic>=1.13.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "boto3>=1.34.0",
    "psycopg[binary]>=3.2.0",
    "networkx>=3.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "openpyxl>=3.1.2",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
