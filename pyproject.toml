[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["XR7*", "xr7_common*", "shared*"]

[project]
name = "XR7"
version = "2.0.0"
description = "XR7 Engine 2 - Artist Earnings Accuracy Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "alembic>=1.13.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "boto3>=1.34.0",
    "psycopg[binary]>=3.2.0",
    "networkx>=3.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "openpyxl>=3.1.2",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.24.0",
    # linting & formatting
    "ruff>=0.4.4",
    "black>=24.4.2",
    # type checking
    "mypy>=1.10.0",
    "types-redis",
    "types-requests",
    "types-PyYAML",
    # security & static analysis
    "bandit>=1.7.8",
    "vulture>=2.11",
    "pylint>=3.2.2",
    "pip-audit>=2.7.3",
    "import-linter>=2.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "XR7.core.*"
strict = true

[[tool.mypy.overrides]]
module = "shared.utils.*"
strict = true

[tool.bandit]
exclude_dirs = [".venv", "alembic", "tests"]
severity = "medium"
confidence = "high"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
